name: Build Quest Voice Board APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for scripts
        run: chmod +x gradlew scripts/*.sh

      - name: Cache SenseVoice ASR Model
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17/model.int8.onnx
          key: asr-model-sensevoice-v1

      - name: Download ASR Model if not cached
        run: ./scripts/download-models.sh

      - name: Build APKs (Debug & Release)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-voice-board-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: quest-voice-board-release
          path: app/build/outputs/apk/release/*.apk
